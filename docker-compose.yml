version: '3.8'

services:
  nivorq-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nivorq-service
    ports:
      - "8000:8080"
    environment:
      - PORT=8080
      - HOST=0.0.0.0
      - GEMINI_MODEL=gemini-2.5-flash
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - ENV=production
    restart: unless-stopped
