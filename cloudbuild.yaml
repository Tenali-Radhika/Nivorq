steps:
  # 1. Build the container image using Dockerfile
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/nivorq-app:$COMMIT_SHA', '.']

  # 2. Push the image to Google Container Registry / Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/nivorq-app:$COMMIT_SHA']

  # 3. Deploy container image to Google Cloud Run (Serverless)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'nivorq-service'
      - '--image'
      - 'gcr.io/$PROJECT_ID/nivorq-app:$COMMIT_SHA'
      - '--region'
      - 'asia-southeast1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--set-env-vars'
      - 'ENV=production,GEMINI_MODEL=gemini-2.5-flash,GCP_REGION=asia-southeast1'

images:
  - 'gcr.io/$PROJECT_ID/nivorq-app:$COMMIT_SHA'

options:
  logging: CLOUD_LOGGING_ONLY
